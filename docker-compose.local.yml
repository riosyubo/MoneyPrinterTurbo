x-common-volumes: &common-volumes
  - ./app:/MoneyPrinterTurbo/app
  - ./webui:/MoneyPrinterTurbo/webui
  - ./config.toml:/MoneyPrinterTurbo/config.toml
  - ./storage:/MoneyPrinterTurbo/storage

services:
  redis:
    image: redis:7-alpine
    container_name: moneyprinterturbo-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  webui:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-webui
    ports:
      - "127.0.0.1:8501:8501"
    command:
      - streamlit
      - run
      - ./webui/Main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.serverAddress=127.0.0.1
      - --server.enableCORS=True
      - --browser.gatherUsageStats=False
      - --client.toolbarMode=minimal
      - --logger.hideWelcomeMessage=True
      - --server.showEmailPrompt=False
    environment:
      MPT_APP_REDIS_HOST: redis
    volumes: *common-volumes
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-api
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python3", "main.py"]
    environment:
      MPT_APP_REDIS_HOST: redis
    volumes: *common-volumes
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
